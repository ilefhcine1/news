name: Daily tech digest

on:
  schedule:
    # 05:40 UTC = 06:40 in Tunisia (UTC+1). GitHub often starts scheduled
    # jobs a few minutes late, so this lands in the inbox around 7:00.
    - cron: "40 5 * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual tests

permissions:
  contents: write         # lets the job save seen_urls.json (no repeats)

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send digest
        env:
          # Provider is a repository *variable* (Settings → Variables); defaults to free Gemini.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python news_digest.py
      - name: Save sent history
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add seen_urls.json || true
          git diff --staged --quiet || (git commit -m "Update sent history" && git push)
